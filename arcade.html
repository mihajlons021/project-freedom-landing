<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mortal Kombat — Project Freedom Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#000;color:#fff;font-family:'Rajdhani',sans-serif;display:flex;flex-direction:column;overflow:hidden;}
header{background:#04040c;border-bottom:1px solid rgba(168,85,247,0.25);padding:8px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:44px;}
.logo{font-family:'Orbitron',sans-serif;font-size:0.75rem;font-weight:700;color:#a855f7;letter-spacing:2px;text-decoration:none;}
.title{font-family:'Orbitron',sans-serif;font-size:0.7rem;color:#4ade80;letter-spacing:3px;}
.back{font-family:'Orbitron',sans-serif;font-size:0.6rem;color:rgba(255,255,255,0.4);text-decoration:none;border:1px solid rgba(255,255,255,0.15);padding:5px 14px;border-radius:6px;}
.back:hover{color:#fff;}
.game-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;position:relative;}
#scaler{transform-origin:top left;position:absolute;top:0;left:0;}
#scaler iframe{display:block;border:none;width:800px;height:600px;}
footer{background:#04040c;border-top:1px solid rgba(168,85,247,0.15);padding:7px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:36px;}
.ctrl{font-size:0.78rem;color:rgba(255,255,255,0.4);}
.ctrl b{color:#a855f7;}
</style>
</head>
<body>
<header>
  <a href="/" class="logo">◂ PROJECT FREEDOM</a>
  <div class="title">🕹️ MORTAL KOMBAT 1992 · FREE vs CPU</div>
  <a href="/" class="back">← Back to site</a>
</header>
<div class="game-wrap" id="wrap">
  <div id="scaler">
    <iframe src="https://archive.org/embed/arcade_mk" allowfullscreen allow="fullscreen" scrolling="no"></iframe>
  </div>
</div>
<footer>
  <div class="ctrl"><b>5</b> Coin &nbsp;·&nbsp; <b>1</b> Start &nbsp;·&nbsp; <b>↑↓←→</b> Move &nbsp;·&nbsp; <b>Ctrl</b> Hi-Punch &nbsp;·&nbsp; <b>Alt</b> Lo-Punch &nbsp;·&nbsp; <b>Space</b> Hi-Kick &nbsp;·&nbsp; <b>Shift</b> Lo-Kick &nbsp;·&nbsp; <b>Z</b> Block</div>
  
</footer>
<script>
function scaleGame(){
  var wrap = document.getElementById('wrap');
  var scaler = document.getElementById('scaler');
  var gameW = 800, gameH = 600;
  var wrapW = wrap.offsetWidth;
  var wrapH = wrap.offsetHeight;
  var scale = Math.min(wrapW / gameW, wrapH / gameH);
  var scaledW = gameW * scale;
  var scaledH = gameH * scale;
  var offsetX = (wrapW - scaledW) / 2;
  var offsetY = (wrapH - scaledH) / 2;
  scaler.style.transform = 'translate(' + offsetX + 'px,' + offsetY + 'px) scale(' + scale + ')';
}
window.addEventListener('load', scaleGame);
window.addEventListener('resize', scaleGame);
</script>
</body>
</html>
